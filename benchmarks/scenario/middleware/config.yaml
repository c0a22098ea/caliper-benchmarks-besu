simpleArgs: &simple-args
  # 開始トークンIDを指定します。再実行時は未使用の範囲に変更してください。
  tokenId: 1440
test:
  name: middleware-concurrency-matrix
  description: >-
    All nine CRUD concurrency scenarios; Setup rounds prepare existing tokens
    for cases 04–09.
  workers:
    number: 1
  rounds:
    - label: 01. Create vs Create
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: benchmarks/scenario/middleware/nine_nine/case01.js
        arguments:
          <<: *simple-args
      sleepAfterRound: 5
    - label: 02. Create vs Update
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
